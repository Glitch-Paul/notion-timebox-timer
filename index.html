<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Timebox Timer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="timer-app" id="timer-app" data-state="idle">
    <div class="timer-dial" aria-label="Timebox Timer">
      <svg class="ring-svg" viewBox="0 0 240 240" aria-hidden="true">
        <circle class="ring-track" cx="120" cy="120" r="108"></circle>
        <!-- Mirror horizontally so elapsed time empties clockwise from 12 o'clock -->
        <g transform="translate(240, 0) scale(-1, 1)">
          <circle
            class="ring-progress"
            id="ring-progress"
            cx="120"
            cy="120"
            r="108"
            transform="rotate(-90 120 120)"
          ></circle>
        </g>
      </svg>

      <div class="dial-center">
        <div class="controls-row">
          <button
            type="button"
            id="btn-minus"
            class="step-btn"
            aria-label="Minuten verringern"
            title="Weniger Minuten"
          >−</button>

          <span id="minutes-display" class="minutes-value" aria-live="polite">25</span>

          <button
            type="button"
            id="btn-plus"
            class="step-btn"
            aria-label="Minuten erhöhen"
            title="Mehr Minuten"
          >+</button>
        </div>
      </div>
    </div>

    <div class="actions">
      <button type="button" id="btn-primary" class="action-btn primary">Start</button>
      <button type="button" id="btn-secondary" class="action-btn secondary" hidden>Reset</button>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
